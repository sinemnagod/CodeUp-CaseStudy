<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CodeUp Supplier Management</title>

	<script>
	/*
	 * The local Fiori Launchpad.
	 *
	 * This page is deliberately independent of the two UI5 apps: it belongs to
	 * neither of them, it just shows the tiles that open them.
	 *
	 * Why the scripts are loaded by hand instead of with plain <script> tags:
	 * the launchpad sandbox reads window["sap-ushell-config"] the moment it
	 * starts, so the tile configuration has to be in place *before* it loads.
	 */

	function loadScript(src, attributes) {
		return new Promise(function (resolve, reject) {
			var script = document.createElement("script");
			Object.keys(attributes || {}).forEach(function (name) {
				script.setAttribute(name, attributes[name]);
			});
			script.src = src;
			script.onload = resolve;
			script.onerror = function () { reject(new Error("Failed to load " + src)); };
			document.head.appendChild(script);
		});
	}

	/**
	 * Loads the launchpad's own texts.
	 *
	 * This page is not a UI5 app, so it has no ResourceModel to do this for it.
	 * It follows the same rule the two apps follow: take the language from the
	 * browser, fall back to English for anything that is not Turkish.
	 */
	async function loadTexts() {
		// The browser language decides, exactly as in the two UI5 apps.
		// ?sap-language=xx is honoured as well, because that is the standard SAP
		// override and UI5 itself obeys it - without this the shell would switch
		// language while the tiles did not.
		const override = new URLSearchParams(location.search).get("sap-language");
		const language = (override || navigator.language || "en").slice(0, 2).toLowerCase();
		const file = language === "tr" ? "i18n/launchpad_tr.properties" : "i18n/launchpad.properties";
		const body = await (await fetch(file)).text();

		const texts = {};
		body.split("\n").forEach(function (line) {
			const trimmed = line.trim();
			if (!trimmed || trimmed.startsWith("#")) { return; }
			const separator = trimmed.indexOf("=");
			if (separator > 0) {
				texts[trimmed.slice(0, separator).trim()] = trimmed.slice(separator + 1).trim();
			}
		});
		return texts;
	}

	/**
	 * Translates the two tiles once the shell has drawn them.
	 *
	 * Why after rendering, and not in the configuration?
	 * The sandbox fetches appconfig/fioriSandboxConfig.json **itself**, and that
	 * copy replaces anything we put in window["sap-ushell-config"] - the shell
	 * even logs "Merging of arrays is not supported for config key groups.
	 * Overriding the whole array". Removing the tiles from the file is not an
	 * option either: the sandbox then falls back to its own demo tiles.
	 * So the file stays the single place the tiles are declared, and their
	 * texts are replaced here, on the rendered controls.
	 *
	 * Tiles are matched on originalTileId - the id from the config file - so
	 * this does not depend on the English text happening to match.
	 */
	function translateTiles(texts) {
		let translated = 0;
		const byTileId = {
			supplierPortalTile:    { header: texts.portalTitle,    subheader: texts.portalSubtitle },
			supplierApprovalsTile: { header: texts.approvalsTitle, subheader: texts.approvalsSubtitle }
		};

		sap.ui.core.Element.registry.forEach(function (control) {
			if (!control.isA || !control.isA("sap.m.GenericTile")) { return; }
			const parent = control.getParent();
			const context = parent && parent.getBindingContext && parent.getBindingContext();
			const data = context && context.getObject();
			const text = data && byTileId[data.originalTileId];
			if (text) {
				control.setHeader(text.header);
				control.setSubheader(text.subheader);
				translated++;
			}
		});
		return translated;
	}

	/**
	 * The shell finishes rendering before the dashboard has loaded its tiles,
	 * so translating once on onAfterRendering is too early - the tiles do not
	 * exist yet. Keep looking briefly until both are there.
	 */
	function translateTilesWhenReady(texts, attemptsLeft) {
		if (translateTiles(texts) >= 2) { return; }
		if (attemptsLeft > 0) {
			setTimeout(function () { translateTilesWhenReady(texts, attemptsLeft - 1); }, 250);
		}
	}

	/**
	 * Who is logged in?
	 *
	 * /user-api/currentUser is a built-in endpoint of the approuter. It is
	 * reachable only because xs-app.json declares a route for the
	 * "sap-approuter-userapi" service - without that route the request falls
	 * through to the static file handler and returns 404.
	 *
	 * It therefore only answers on :5000. Opened directly on :4004 there is no
	 * approuter and no SAP login, so we show no user at all.
	 */
	async function fetchCurrentUser() {
		try {
			const response = await fetch("/user-api/currentUser");
			if (!response.ok) { return null; }
			const user = await response.json();
			return user && user.name ? user : null;
		} catch (error) {
			return null;
		}
	}

	/**
	 * Puts the logged-in SAP user in the top right of the shell header.
	 *
	 * The classic launchpad drew a user avatar by itself, driven by
	 * services.Container.adapter.config.userProfile. Current SAPUI5 no longer
	 * does: the sandbox reports every user as "Default User" and creates no
	 * avatar control at all. So we add our own header item, which is a
	 * documented part of the renderer API.
	 */
	function addUserToHeader(renderer, user, texts) {
		const fullName = [user.firstname, user.lastname].filter(Boolean).join(" ") || user.name;
		const email = user.email || user.name;

		renderer.addHeaderEndItem({
			id: "currentUserItem",
			icon: "sap-icon://person-placeholder",
			tooltip: fullName + " (" + email + ")",
			ariaLabel: fullName,
			press: function (event) {
				const source = event.getSource();
				sap.ui.require([
					"sap/m/ResponsivePopover", "sap/m/VBox", "sap/m/Title",
					"sap/m/Text", "sap/m/Button"
				], function (ResponsivePopover, VBox, Title, Text, Button) {
					if (!window._userPopover) {
						window._userPopover = new ResponsivePopover({
							title: texts.userMenuTitle,
							placement: "Bottom",
							contentWidth: "18rem",
							content: [
								new VBox({
									items: [
										new Title({ text: fullName, level: "H4" }),
										new Text({ text: email }),
										new Button({
											text: texts.signOut,
											icon: "sap-icon://log",
											type: "Transparent",
											// the approuter's logout endpoint, declared in xs-app.json
											press: function () { window.location.href = "/do/logout"; }
										}).addStyleClass("sapUiSmallMarginTop")
									]
								}).addStyleClass("sapUiSmallMargin")
							]
						});
					}
					window._userPopover.openBy(source);
				});
			}
		}, true, ["home", "app"], true);
	}

	(async function startLaunchpad() {
		const config = await (await fetch("appconfig/fioriSandboxConfig.json")).json();
		const texts = await loadTexts();

		// systemProperties is not optional: without it the sandbox's UserInfo
		// service throws "Cannot read properties of undefined (reading
		// 'getSystem')" while the shell is starting up.
		config.services.Container = {
			adapter: {
				config: {
					systemProperties: {
						systemName: "CodeUp",
						systemRole: "DEV",
						tenantRole: "DEV",
						productName: "Supplier Management"
					}
				}
			}
		};

		window["sap-ushell-config"] = config;

		const user = await fetchCurrentUser();

		// the sandbox first, then UI5 itself - this order matters
		await loadScript("https://ui5.sap.com/test-resources/sap/ushell/bootstrap/sandbox.js",
			{ id: "sap-ushell-bootstrap" });

		await loadScript("https://ui5.sap.com/resources/sap-ui-core.js", {
			id: "sap-ui-bootstrap",
			"data-sap-ui-libs": "sap.m,sap.ushell,sap.ui.layout",
			"data-sap-ui-theme": "sap_horizon",
			"data-sap-ui-compat-version": "edge",
			"data-sap-ui-async": "true",
			"data-sap-ui-frame-options": "allow"
		});

		sap.ui.require(["sap/ushell/Container"], async function (Container) {
			// Two different objects, easily confused:
			//   createRenderer()        -> the Shell *control*, which we place on the page
			//   getRendererInternal()   -> the Renderer *API*, which can add header items
			const shell = await Promise.resolve(Container.createRenderer("fiori2", true));
			shell.placeAt("content");

			// The header item has to be added *after* the shell has rendered and
			// settled into its "home" state. Added any earlier it is created but
			// never shown, because the shell then rebuilds the header for the
			// state it is switching into.
			// Both the tile texts and the user item have to wait until the shell
			// has rendered: anything added earlier is built and then discarded
			// when the shell switches into its "home" state.
			let done = false;
			shell.addEventDelegate({
				onAfterRendering: async function () {
					if (done) { return; }
					done = true;

					translateTilesWhenReady(texts, 40);   // up to ~10 seconds

					if (user) {
						const api = Container.getRendererInternal
							? Container.getRendererInternal("fiori2")
							: Container.getRenderer("fiori2");
						addUserToHeader(await Promise.resolve(api), user, texts);
					}
				}
			});
		});
	})();
	</script>
</head>

<body class="sapUiBody">
	<div id="content"></div>
</body>
</html>
