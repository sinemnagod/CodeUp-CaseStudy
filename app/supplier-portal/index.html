<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Supplier Portal</title>

	<!--
		This loads SAPUI5 from SAP's public CDN.
		We use ui5.sap.com (not openui5.org) because we need two libraries that
		only exist in the full SAPUI5: sap.suite.ui.commons (the ProcessFlow)
		and sap.ui.unified (the FileUploader).

		Note there is NO data-sap-ui-language attribute on purpose.
		Without it UI5 takes the language from the browser, which is exactly
		what the use case asks for.
	-->
	<script id="sap-ui-bootstrap"
		src="https://ui5.sap.com/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-resource-roots='{"codeup.supplierportal": "./"}'
		data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
		data-sap-ui-compat-version="edge"
		data-sap-ui-async="true"
		data-sap-ui-frame-options="trusted">
	</script>
</head>

<body class="sapUiBody" id="content">
	<div data-sap-ui-component
	     data-name="codeup.supplierportal"
	     data-id="container"
	     data-height="100%"
	     data-settings='{"id": "supplierportal"}'></div>
</body>
</html>
